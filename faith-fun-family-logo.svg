<svg xmlns:xlink="http://www.w3.org/1999/xlink" id="blog-logo" class="logo-svg" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <style>
                    .logo-font-main { font-family: 'Georgia', serif; font-size: 20px; font-weight: bold; fill: #333; }
                    .logo-font-sub { font-family: 'Helvetica', sans-serif; font-size: 10px; fill: #777; letter-spacing: 0.5px; }
                    .icon-color { fill: #4FD1C5; } /* A friendly teal color */
                </style>
            </defs>
            
            <!-- Icon: House + Heart + Cross -->
            <g transform="translate(100, 40)">
                <path class="icon-color" d="M-30,0 L0,-25 L30,0 L20,0 L20,25 L-20,25 L-20,0 Z M0,2 C-12,2 -12,20 0,20 C12,20 12,2 0,2 Z M0,3 L0,15 M-6,9 L6,9" stroke="#4FD1C5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>

            <!-- Text -->
            <text x="100" y="90" class="logo-font-main" text-anchor="middle">Faith Fun Family</text>
            <text x="100" y="105" class="logo-font-sub" text-anchor="middle">THE RAILTONS</text>
        </svg>